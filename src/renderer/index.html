<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>yamulttak-pet overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* 오버레이 전체에서 텍스트 선택/드래그 고스트를 막는다 */
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
        /* 도트가 뭉개지지 않게 */
        image-rendering: pixelated;
      }

      /* ---------------------------------------------------------------
         이름표 — 어두운 반투명 캡슐 + 캡슐 바깥 왼쪽의 상태 점.
         색은 레퍼런스에서 그대로 뽑은 Apple 시스템 컬러.
         --------------------------------------------------------------- */
      #nametags {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .nametag {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 5px;
        transform: translate(-50%, -100%);
        white-space: nowrap;
      }
      /* 화면 위쪽 가장자리에서는 머리 아래로 */
      .nametag--below {
        transform: translate(-50%, 0);
      }
      .nametag__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #30d158;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.22);
      }
      .nametag__dot[data-state="sleep"] {
        background: #ff9f0a;
      }
      .nametag__dot[data-state="idle"] {
        background: #ff453a;
      }
      .nametag__label {
        padding: 2px 9px 3px;
        border-radius: 10px;
        background: rgba(10, 10, 14, 0.64);
        color: #fdfdff;
        font:
          700 11px/1.45 ui-sans-serif,
          -apple-system,
          "Apple SD Gothic Neo",
          sans-serif;
        letter-spacing: -0.1px;
      }

      /* ---------------------------------------------------------------
         말풍선. 공통 골격만 여기서 잡고, 색·모양은 캐릭터별로 아래에서.
         --------------------------------------------------------------- */
      #bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bubble {
        /* 캐릭터별로 덮어쓰는 값들 */
        --bub-bg: rgba(12, 12, 16, 0.85);
        --bub-fg: #fdfdff;
        --bub-line: 0;
        --bub-radius: 13px;
        --bub-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        --bub-font:
          600 13px/1.35 ui-sans-serif, -apple-system, "Apple SD Gothic Neo",
          sans-serif;
        --bub-tilt: 0deg;

        position: absolute;
        /* 앵커는 머리 꼭대기 중앙 — 거기서 위로 띄운다 */
        /* 이름표 높이만큼 더 띄워서 겹치지 않게 (--bub-lift 는 app.js 가 조정) */
        transform: translate(-50%, -100%)
          translateY(calc(-11px - var(--bub-lift, 0px))) rotate(var(--bub-tilt));
        /* 폭은 고정하고 글이 길어지면 아래로만 늘어난다 —
           말풍선이 글자 수에 따라 좌우로 늘었다 줄었다 하면 산만하다 */
        width: 100px;
        padding: 6px 11px;
        border: var(--bub-line);
        border-radius: var(--bub-radius);
        background: var(--bub-bg);
        color: var(--bub-fg);
        font: var(--bub-font);
        white-space: pre-wrap;
        word-break: break-word;
        box-shadow: var(--bub-shadow);
        transition: opacity 120ms linear;
      }
      /* 꼬리 — 배경/테두리를 그대로 물려받아 말풍선과 이어 보이게 한다 */
      .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: var(--bub-bg);
        border-right: var(--bub-line);
        border-bottom: var(--bub-line);
        transform: rotate(45deg);
      }

      /* 강초당 — 흑백 허스키. 굵은 검정 테두리의 각진 만화 말풍선 */
      .bubble--chodang {
        --bub-bg: #fdfdfd;
        --bub-fg: #221d24;
        --bub-line: 2.5px solid #221d24;
        --bub-radius: 7px;
        --bub-shadow: 2px 3px 0 rgba(34, 29, 36, 0.22);
        --bub-font:
          700 13px/1.35 ui-sans-serif, -apple-system, "Apple SD Gothic Neo",
          sans-serif;
      }

      /* 구라베 — 레서판다 / 라떼. 따뜻한 크림색에 동글동글 */
      .bubble--rave {
        --bub-bg: #fdf3e4;
        --bub-fg: #50290f;
        --bub-line: 2px solid #a56a3c;
        --bub-radius: 19px;
        --bub-shadow: 0 3px 10px rgba(80, 41, 15, 0.22);
        --bub-font: 600 13px/1.4 ui-serif, "Apple SD Gothic Neo", serif;
      }

      /* 망난이 — 파란 새. 왜! 소리치는 느낌으로 각지고 살짝 기울임 */
      .bubble--mangnani {
        --bub-bg: #d8efff;
        --bub-fg: #102336;
        --bub-line: 2.5px solid #24486b;
        --bub-radius: 4px;
        --bub-shadow: 0 3px 0 #24486b;
        --bub-font:
          800 13.5px/1.3 ui-sans-serif, -apple-system, "Apple SD Gothic Neo",
          sans-serif;
        --bub-tilt: -2.5deg;
        letter-spacing: -0.2px;
      }

      /* 송몽숙 — 졸린 보라 고양이. 테두리 없는 뭉글한 구름, 꼬리도 동글동글 */
      .bubble--mongsuk {
        --bub-bg: rgba(247, 234, 253, 0.95);
        --bub-fg: #55175c;
        --bub-radius: 22px 24px 20px 26px;
        --bub-shadow: 0 4px 14px rgba(85, 23, 92, 0.2);
        --bub-font:
          600 13px/1.45 ui-rounded, ui-sans-serif, "Apple SD Gothic Neo",
          sans-serif;
      }
      /* 생각풍선처럼 동글한 꼬리 두 개 */
      .bubble--mongsuk::after {
        width: 9px;
        height: 9px;
        bottom: -6px;
        margin-left: -8px;
        border-radius: 50%;
        transform: none;
      }
      .bubble--mongsuk::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -13px;
        width: 5px;
        height: 5px;
        margin-left: 1px;
        border-radius: 50%;
        background: var(--bub-bg);
      }

      /* 장폰주 — 양 / 게임기. 픽셀 게임 UI 느낌으로 모서리 없이 각지게 */
      .bubble--ponzoo {
        --bub-bg: #fdf6e3;
        --bub-fg: #3b2410;
        --bub-line: 3px solid #7a5a2e;
        --bub-radius: 0;
        --bub-shadow: 3px 3px 0 rgba(59, 36, 16, 0.25);
        --bub-font: 600 12.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      }
      /* 꼬리도 다이아몬드가 아니라 각진 블록으로 — 도트 느낌 유지 */
      .bubble--ponzoo::after {
        width: 9px;
        height: 9px;
        bottom: -9px;
        margin-left: -4px;
        transform: none;
        border-right: none;
        border-bottom: var(--bub-line);
        border-left: var(--bub-line);
      }

      /* 입력 중인 말풍선 — 캐릭터 색은 그대로 쓰고 캐럿만 얹는다 */
      .bubble--edit {
        pointer-events: auto;
      }
      .bubble--edit input {
        all: unset;
        width: 100%;
        color: var(--bub-fg);
        font: inherit;
        caret-color: var(--bub-fg);
      }
      .bubble--edit input::placeholder {
        color: currentColor;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="nametags"></div>
    <div id="bubbles"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
